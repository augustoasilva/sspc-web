<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#414B3B" />
    <title>Só Saio Pra Comer</title>
    <meta name="description" content="Reviews sinceros de restaurantes em Teresina. Em obras." />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/site.css" />
  </head>
  <body>
    <main class="home">
      <header class="home__tags">
        <p class="tag type-label-sm">Edição digital • Em obras</p>
        <p class="tag type-label-sm">Teresina, Piauí</p>
      </header>

      <section class="home__hero" aria-label="Só Saio Pra Comer">
        <svg
          class="home__arch"
          viewBox="0 0 320 420"
          preserveAspectRatio="xMidYMid meet"
          aria-hidden="true"
          focusable="false"
        >
          <path class="arch arch--outer" d="M40 400 V170 A120 120 0 0 1 280 170 V400 Z" />
          <path class="arch arch--inner" d="M70 400 V170 A90 90 0 0 1 250 170 V400 Z" />
          <path class="spark spark--gold" d="M160 40 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 l18 -6 Z" />
          <path class="spark spark--sage" d="M268 330 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 Z" />
          <path class="spark spark--gold" d="M52 110 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 Z" />
        </svg>
        <div class="home__wordmark">
          <p class="type-wordmark">Só Saio Pra Comer</p>
          <p class="type-label-lg">Guia gastronômico</p>
        </div>
      </section>

      <h1 class="home__headline type-headline-md">Reviews sinceros de restaurantes em Teresina.</h1>
      <p class="home__text type-body-lg">Estamos preparando a mesa. O site chega em breve.</p>

      <a class="button type-title-md" href="/links/">
        <span>Ver nossos links</span>
        <span aria-hidden="true">→</span>
      </a>

      <figure class="home__quote">
        <blockquote class="type-body-md">
          <p>Em mais um review sincero.</p>
        </blockquote>
        <figcaption class="type-label-sm">Teresina, Piauí</figcaption>
      </figure>

      <div class="blob blob--top" aria-hidden="true"></div>
      <div class="blob blob--bottom" aria-hidden="true"></div>
    </main>
  </body>
</html>
