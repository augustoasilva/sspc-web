name: CI

# Runs on every push to an open pull request into develop or main (pull_request, including its
# opening), and on every push to develop or main after a merge (push). Pushes to other branches
# do not run it. There are no path filters: every pull request shows every result (FR-026, SC-008).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check the design source
        run: npm run design:lint
      - name: Lint code and styles
        run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run the app tests (jsdom)
        run: npm test -- --watch=false
      - name: Run the tool tests (node)
        run: npm run test:tools

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check the generated tokens
        run: npm run tokens:check
      - name: Build the app
        run: npm run build
      - name: Check the build output
        run: |
          set -euo pipefail
          out=dist/sspc-web/browser
          fail() { echo "build check failed: $1" >&2; exit 1; }
          if grep -rq 'sspc-catalog' "$out"; then fail "the catalogue is in the production build"; fi
          if grep -rq 'onload=' "$out"; then fail "an inline event handler is in the build"; fi
          if find "$out" -name '*.map' | grep -q .; then fail "a source map is in the build"; fi
          if grep -rq 'sourceMappingURL' "$out"; then fail "a sourceMappingURL is in the build"; fi
          if grep -Eq 'https?://' "$out/index.html" "$out/manifest.webmanifest" "$out/ngsw.json"; then fail "an absolute URL is in index.html, the manifest or ngsw.json"; fi
          if ! grep -Eq '"dataGroups": *\[\]' "$out/ngsw.json"; then fail "ngsw.json has data groups"; fi
          if grep -Eq 'https?://' "$out"/*.css 2>/dev/null; then fail "an absolute URL is in a stylesheet"; fi
          node scripts/check-ngsw-assets.mjs "$out"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run the policy checks
        run: npm run policy
      - name: Audit dependencies
        run: npm run audit
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan the history for secrets
        run: gitleaks git --redact --verbose
      - name: Check tracked secret paths
        run: bash scripts/check-tracked-secrets.sh
      - name: Lint the shell scripts
        run: shellcheck scripts/*.sh

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: sspc-web:ci
          build-args: |
            APP_VERSION=0.0.0+ci
            APP_BUILD=${{ github.sha }}
      - name: Build the site image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          load: true
          push: false
          tags: sspc-site:ci
      - name: Build the counter image (test only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/offline-proof/Dockerfile
          load: true
          push: false
          tags: sspc-offline-proof:ci
      - name: Smoke-test the app image
        env:
          SMOKE_CHECK_VERSION: '1'
        run: scripts/smoke-app.sh sspc-web:ci
      - name: Smoke-test the site image
        run: scripts/smoke-site.sh sspc-site:ci
      - name: Smoke-test the counter image
        run: scripts/smoke-counter.sh sspc-offline-proof:ci
      - name: Derive the Trivy ignore file
        run: node scripts/policy/exceptions.mjs --trivy-out "$RUNNER_TEMP/trivyignore.yaml"
      - name: Scan the app image for medium and lower findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: sspc-web:ci
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM
          exit-code: '0'
          trivyignores: ${{ runner.temp }}/trivyignore.yaml
      - name: Fail the app image on high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: sspc-web:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: ${{ runner.temp }}/trivyignore.yaml
      - name: Scan the site image for medium and lower findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: sspc-site:ci
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM
          exit-code: '0'
          trivyignores: ${{ runner.temp }}/trivyignore.yaml
      - name: Fail the site image on high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: sspc-site:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: ${{ runner.temp }}/trivyignore.yaml
      - name: Scan the counter image for medium and lower findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: sspc-offline-proof:ci
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM
          exit-code: '0'
          trivyignores: ${{ runner.temp }}/trivyignore.yaml
      - name: Fail the counter image on high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: sspc-offline-proof:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: ${{ runner.temp }}/trivyignore.yaml

  branch-guard:
    name: branch-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release branch name
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: scripts/check-branch-guard.sh "$BASE_REF" "$HEAD_REF"
