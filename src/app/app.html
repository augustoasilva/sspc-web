<sspc-app-bar [heading]="title()" [showBack]="showBack()" backLabel="Voltar" (back)="goBack()">
  <sspc-status-chip end [tone]="connectivity.online() ? 'positive' : 'neutral'" [dot]="connectivity.online()">
    @if (connectivity.online()) {
      <svg lucideWifi icon aria-hidden="true"></svg>
    } @else {
      <svg lucideWifiOff icon aria-hidden="true"></svg>
    }
    {{ connectivity.label() }}
  </sspc-status-chip>
</sspc-app-bar>

<main class="sspc-shell__main">
  <div class="sspc-shell__banner" data-slot="banner">
    @if (!secureContext.secure) {
      <sspc-banner tone="error">{{ secureContext.message }}</sspc-banner>
    }
  </div>
  <router-outlet />
</main>

<sspc-tab-bar [items]="tabs" [activeId]="activeId()" ariaLabel="Principal" (itemSelect)="navigate($event)" />
